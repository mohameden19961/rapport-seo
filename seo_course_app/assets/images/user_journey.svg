<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="38" fill="#2C5F8A"/>
  <text x="400.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Parcours utilisateur: recherche traditionnelle vs IA</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <rect x="30" y="40" width="340" height="35" rx="5" fill="#D93025"/>
  <text x="200.0" y="61.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold">RECHERCHE TRADITIONNELLE</text>
  <rect x="40" y="95" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="200.0" y="116.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">1. Tape la requete</text>
  <rect x="40" y="95" width="320" height="35" rx="5" fill="none" stroke="#D93025" stroke-width="1"/>
  <line x1="200" y1="130" x2="200" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="145" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="200.0" y="166.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">2. Lit la SERP (10 liens)</text>
  <rect x="40" y="145" width="320" height="35" rx="5" fill="none" stroke="#D93025" stroke-width="1"/>
  <line x1="200" y1="180" x2="200" y2="190" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="195" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="200.0" y="216.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">3. Clique sur un resultat</text>
  <rect x="40" y="195" width="320" height="35" rx="5" fill="none" stroke="#D93025" stroke-width="1"/>
  <line x1="200" y1="230" x2="200" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="245" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="200.0" y="266.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">4. Navigue sur le site</text>
  <rect x="40" y="245" width="320" height="35" rx="5" fill="none" stroke="#D93025" stroke-width="1"/>
  <line x1="200" y1="280" x2="200" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="295" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="200.0" y="316.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">5. Revient si insatisfait</text>
  <rect x="40" y="295" width="320" height="35" rx="5" fill="none" stroke="#D93025" stroke-width="1"/>
  <rect x="430" y="40" width="340" height="35" rx="5" fill="#188038"/>
  <text x="600.0" y="61.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold">RECHERCHE AVEC IA GENERATIVE</text>
  <rect x="440" y="95" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="600.0" y="116.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">1. Pose la question en NL</text>
  <rect x="440" y="95" width="320" height="35" rx="5" fill="none" stroke="#188038" stroke-width="1"/>
  <line x1="600" y1="130" x2="600" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="145" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="600.0" y="166.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">2. Obtient une reponse synthetisee</text>
  <rect x="440" y="145" width="320" height="35" rx="5" fill="none" stroke="#188038" stroke-width="1"/>
  <line x1="600" y1="180" x2="600" y2="190" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="195" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="600.0" y="216.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">3. Pose des questions de suivi</text>
  <rect x="440" y="195" width="320" height="35" rx="5" fill="none" stroke="#188038" stroke-width="1"/>
  <line x1="600" y1="230" x2="600" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="245" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="600.0" y="266.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">4. Recoit des recommandations</text>
  <rect x="440" y="245" width="320" height="35" rx="5" fill="none" stroke="#188038" stroke-width="1"/>
  <line x1="600" y1="280" x2="600" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="295" width="320" height="35" rx="5" fill="#F0F0F0"/>
  <text x="600.0" y="316.5" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">5. L'IA execute l'action (agentic)</text>
  <rect x="440" y="295" width="320" height="35" rx="5" fill="none" stroke="#188038" stroke-width="1"/>
  <rect x="100" y="350" width="600" height="40" rx="5" fill="#F9AB00"/>
  <text x="400.0" y="374.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Impact SEO: le modele traditionnel est perturbe - l'optimisation LLM devient cruciale</text>
  <text x="100" y="420" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Les utilisateurs passent de la navigation de liens a la consommation de reponses generees</text>
</svg>
