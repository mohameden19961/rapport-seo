<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="38" fill="#2C5F8A"/>
  <text x="400.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Processus SEO : des fondations a la strategie</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <rect x="30" y="50" width="160" height="65" rx="5" fill="#2C5F8A"/>
  <text x="110.0" y="86.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">STRATEGIE</text>
  <text x="210" y="75" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Objectifs business, KPI, calendrier, budget</text>
  <text x="210" y="100" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Cliquez pour details -></text>
  <line x1="350" y1="115" x2="350" y2="135" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="135" width="160" height="65" rx="5" fill="#D93025"/>
  <text x="110.0" y="171.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">OFF-PAGE</text>
  <text x="210" y="160" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Backlinks, E-E-A-T, Digital PR, mentions</text>
  <text x="210" y="185" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Cliquez pour details -></text>
  <line x1="350" y1="200" x2="350" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="220" width="160" height="65" rx="5" fill="#F9AB00"/>
  <text x="110.0" y="256.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">ON-PAGE</text>
  <text x="210" y="245" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Contenu, mots-cles, balises, maillage interne</text>
  <text x="210" y="270" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Cliquez pour details -></text>
  <line x1="350" y1="285" x2="350" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="305" width="160" height="65" rx="5" fill="#1A73E8"/>
  <text x="110.0" y="341.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">TECHNIQUE</text>
  <text x="210" y="330" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Indexation, Core Web Vitals, mobile, donnees structurees</text>
  <text x="210" y="355" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Cliquez pour details -></text>
  <line x1="350" y1="370" x2="350" y2="390" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="390" width="160" height="65" rx="5" fill="#188038"/>
  <text x="110.0" y="426.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">FONDATIONS</text>
  <text x="210" y="415" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Crawling, indexation, serveur, architecture</text>
  <text x="210" y="440" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Cliquez pour details -></text>
  <rect x="450" y="80" width="300" height="350" rx="5" fill="#F0F0F0"/>
  <text x="600.0" y="259.0" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="0" font-weight="bold"></text>
  <text x="470" y="110" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="14">Piliers du SEO</text>
  <rect x="450" y="80" width="300" height="350" rx="10" fill="none" stroke="#2C5F8A" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="470" y="140" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">1. Contenu de qualite</text>
  <text x="470" y="162" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">   (E-E-A-T, topical authority)</text>
  <text x="470" y="184" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">2. Experience utilisateur</text>
  <text x="470" y="206" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">   (Core Web Vitals, UX, mobile)</text>
  <text x="470" y="228" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">3. Autorite du domaine</text>
  <text x="470" y="250" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">   (backlinks, mentions, Digital PR)</text>
  <text x="470" y="272" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">4. Technique solide</text>
  <text x="470" y="294" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">   (indexation, structure, schema)</text>
  <text x="470" y="316" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">5. Strategie basee sur les donnees</text>
  <text x="470" y="338" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">   (GSC, GA4, audit regulier)</text>
</svg>
