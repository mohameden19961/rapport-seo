Duree, titre, miniature
Carrousel video</text>
  <line x1="380" y1="115" x2="415" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="120" width="130" height="50" rx="5" fill="#1A73E8"/>
  <text x="575.0" y="149.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold">News sitemap</text>
