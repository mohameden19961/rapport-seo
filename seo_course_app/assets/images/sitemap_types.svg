  <rect x="250" y="50" width="260" height="40" rx="5" fill="#2C5F8A"/>
  <text x="380.0" y="74.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">Sitemap Index File</text>
