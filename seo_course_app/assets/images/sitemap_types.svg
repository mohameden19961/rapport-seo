  <line x1="380" y1="115" x2="735" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="250" width="700" height="45" rx="5" fill="#188038"/>
  <text x="380.0" y="276.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Bonnes pratiques: referencez le sitemap dans robots.txt, soumettez-le dans GSC</text>
  <text x="40" y="315" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Exemple de sitemap index:</text>
  <text x="50" y="335" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9"><?xml version="1.0" encoding="UTF-8"?></text>
  <text x="50" y="353" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9"><sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></text>
  <text x="50" y="371" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">  <sitemap><loc>https://exemple.com/sitemap-pages.xml</loc></sitemap></text>
  <text x="50" y="389" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">  <sitemap><loc>https://exemple.com/sitemap-images.xml</loc></sitemap></text>
  <text x="50" y="407" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">  <sitemap><loc>https://exemple.com/sitemap-videos.xml</loc></sitemap></text>
  <text x="50" y="425" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9"></sitemapindex></text>
