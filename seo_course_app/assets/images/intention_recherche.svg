<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="g_info" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1967D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_nav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8E3E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_comm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBC05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9AB00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_trans" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D93025;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="15" fill="#f8f9fa"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">Les 4 types d'intention de recherche (Search Intent)</text>

  <!-- Informationnelle -->
  <rect x="30" y="70" width="200" height="380" rx="12" fill="white" stroke="#4285F4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="70" width="200" height="80" rx="12" fill="url(#g_info)"/>
  <rect x="30" y="120" width="200" height="30" fill="url(#g_info)"/>
  <circle cx="130" cy="110" r="22" fill="white" opacity="0.2"/>
  <text x="130" y="115" text-anchor="middle" font-family="Arial" font-size="24" fill="white">&#x1F50D;</text>
  <text x="130" y="165" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Informationnelle</text>

  <text x="130" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#4285F4">Objectif : Apprendre</text>
  <text x="130" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">L'utilisateur cherche</text>
  <text x="130" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">une réponse ou une</text>
  <text x="130" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">information précise.</text>

  <line x1="50" y1="260" x2="210" y2="260" stroke="#ddd" stroke-width="0.5"/>

  <text x="130" y="280" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Exemples :</text>
  <text x="130" y="298" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Comment faire du SEO"</text>
  <text x="130" y="314" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Qu'est-ce que le HTML"</text>
  <text x="130" y="330" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Dfinition backlink"</text>

  <line x1="50" y1="345" x2="210" y2="345" stroke="#ddd" stroke-width="0.5"/>

  <text x="130" y="365" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Type contenu :</text>
  <text x="130" y="383" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Articles de blog</text>
  <text x="130" y="399" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Guides, tutoriels,</text>
  <text x="130" y="415" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">vidos explicatives</text>
  <text x="130" y="435" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Infographies</text>

  <!-- Navigationnelle -->
  <rect x="250" y="70" width="200" height="380" rx="12" fill="white" stroke="#34A853" stroke-width="2" filter="url(#shadow)"/>
  <rect x="250" y="70" width="200" height="80" rx="12" fill="url(#g_nav)"/>
  <rect x="250" y="120" width="200" height="30" fill="url(#g_nav)"/>
  <circle cx="350" cy="110" r="22" fill="white" opacity="0.2"/>
  <text x="350" y="115" text-anchor="middle" font-family="Arial" font-size="24" fill="white">&#x1F3AF;</text>
  <text x="350" y="165" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Navigationnelle</text>

  <text x="350" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#34A853">Objectif : Trouver un site</text>
  <text x="350" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">L'utilisateur cherche</text>
  <text x="350" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">un site web ou une</text>
  <text x="350" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">page spécifique.</text>

  <line x1="270" y1="260" x2="430" y2="260" stroke="#ddd" stroke-width="0.5"/>

  <text x="350" y="280" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Exemples :</text>
  <text x="350" y="298" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Facebook login"</text>
  <text x="350" y="314" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Google Analytics"</text>
  <text x="350" y="330" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"YouTube"</text>

  <line x1="270" y1="345" x2="430" y2="345" stroke="#ddd" stroke-width="0.5"/>

  <text x="350" y="365" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Type contenu :</text>
  <text x="350" y="383" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Page d'accueil</text>
  <text x="350" y="399" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Page de connexion</text>
  <text x="350" y="415" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Page de contact</text>
  <text x="350" y="435" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Réseaux sociaux</text>

  <!-- Commerciale -->
  <rect x="470" y="70" width="200" height="380" rx="12" fill="white" stroke="#FBBC05" stroke-width="2" filter="url(#shadow)"/>
  <rect x="470" y="70" width="200" height="80" rx="12" fill="url(#g_comm)"/>
  <rect x="470" y="120" width="200" height="30" fill="url(#g_comm)"/>
  <circle cx="570" cy="110" r="22" fill="white" opacity="0.2"/>
  <text x="570" y="115" text-anchor="middle" font-family="Arial" font-size="24" fill="#333">&#x1F4B0;</text>
  <text x="570" y="165" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Commerciale</text>

  <text x="570" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#F9AB00">Objectif : Comparer</text>
  <text x="570" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">L'utilisateur compare</text>
  <text x="570" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">les options avant</text>
  <text x="570" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">un achat potentiel.</text>

  <line x1="490" y1="260" x2="650" y2="260" stroke="#ddd" stroke-width="0.5"/>

  <text x="570" y="280" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Exemples :</text>
  <text x="570" y="298" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Meilleur logiciel SEO"</text>
  <text x="570" y="314" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"iPhone 16 vs Samsung S25"</text>
  <text x="570" y="330" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Avis ordinateur X"</text>

  <line x1="490" y1="345" x2="650" y2="345" stroke="#ddd" stroke-width="0.5"/>

  <text x="570" y="365" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Type contenu :</text>
  <text x="570" y="383" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Articles comparatifs</text>
  <text x="570" y="399" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Tests et avis</text>
  <text x="570" y="415" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Vidos unboxing</text>
  <text x="570" y="435" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Guides d'achat</text>

  <!-- Transactionnelle -->
  <rect x="690" y="70" width="180" height="380" rx="12" fill="white" stroke="#EA4335" stroke-width="2" filter="url(#shadow)"/>
  <rect x="690" y="70" width="180" height="80" rx="12" fill="url(#g_trans)"/>
  <rect x="690" y="120" width="180" height="30" fill="url(#g_trans)"/>
  <circle cx="780" cy="110" r="22" fill="white" opacity="0.2"/>
  <text x="780" y="115" text-anchor="middle" font-family="Arial" font-size="24" fill="white">&#x1F6D2;</text>
  <text x="780" y="165" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Transactionnelle</text>

  <text x="780" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#EA4335">Objectif : Acheter</text>
  <text x="780" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">L'utilisateur est prêt</text>
  <text x="780" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">à effectuer un achat</text>
  <text x="780" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">ou une action.</text>

  <line x1="710" y1="260" x2="850" y2="260" stroke="#ddd" stroke-width="0.5"/>

  <text x="780" y="280" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Exemples :</text>
  <text x="780" y="298" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Acheter iPhone 16"</text>
  <text x="780" y="314" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Abonnement Netflix"</text>
  <text x="780" y="330" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">"Réserver hôtel"</text>

  <line x1="710" y1="345" x2="850" y2="345" stroke="#ddd" stroke-width="0.5"/>

  <text x="780" y="365" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Type contenu :</text>
  <text x="780" y="383" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Page produit</text>
  <text x="780" y="399" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Page de paiement</text>
  <text x="780" y="415" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Page d'inscription</text>
  <text x="780" y="435" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">CTA direct</text>
</svg>
