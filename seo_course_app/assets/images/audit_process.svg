<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="38" fill="#2C5F8A"/>
  <text x="400.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Processus d'audit SEO complet</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <rect x="30" y="80" width="170" height="80" rx="5" fill="#D93025"/>
  <text x="115.0" y="124.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Phase 1
Audit technique</text>
  <text x="35" y="185" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Crawl, index, vitesse
robots.txt, sitemap
Core Web Vitals
JS rendering</text>
  <line x1="200" y1="120" x2="260" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="80" width="170" height="80" rx="5" fill="#F9AB00"/>
  <text x="315.0" y="124.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Phase 2
Audit On-Page</text>
  <text x="235" y="185" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Mots-cles par page
Balises title/meta
Headings, contenu
Images, maillage</text>
  <line x1="400" y1="120" x2="460" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="80" width="170" height="80" rx="5" fill="#1A73E8"/>
  <text x="515.0" y="124.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Phase 3
Audit Off-Page</text>
  <text x="435" y="185" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Profil de backlinks
Liens toxiques
Concurrence
Mentions de marque</text>
  <line x1="600" y1="120" x2="660" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="630" y="80" width="170" height="80" rx="5" fill="#188038"/>
  <text x="715.0" y="124.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Phase 4
Rapport et plan</text>
  <text x="635" y="185" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="9">Constatations
Recommandations
Priorisation
Calendrier SEO</text>
  <rect x="50" y="260" width="700" height="50" rx="5" fill="#2C5F8A"/>
  <text x="400.0" y="289.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Outils: Screaming Frog + Ahrefs + GSC + GA4 + PageSpeed Insights + Sitebulb</text>
  <text x="50" y="340" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="13">Matrice de priorisation Impact/Effort:</text>
  <rect x="50" y="360" width="160" height="35" rx="5" fill="#D93025"/>
  <text x="130.0" y="381.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Critique (P1)</text>
  <rect x="220" y="360" width="160" height="35" rx="5" fill="#F9AB00"/>
  <text x="300.0" y="381.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Important (P2)</text>
  <rect x="390" y="360" width="160" height="35" rx="5" fill="#1A73E8"/>
  <text x="470.0" y="381.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Strategique (P3)</text>
  <rect x="560" y="360" width="160" height="35" rx="5" fill="#188038"/>
  <text x="640.0" y="381.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Optimisation (P4)</text>
  <text x="50" y="425" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">L'audit doit etre repete tous les 3 a 6 mois pour suivre l'evolution et les mises a jour Google</text>
</svg>
