<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBC05;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285F4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="200%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" rx="15" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">Les 3 étapes du fonctionnement des moteurs de recherche</text>

  <!-- Étape 1: Crawling -->
  <rect x="50" y="80" width="240" height="180" rx="15" fill="#E8F0FE" stroke="#4285F4" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="170" cy="125" r="30" fill="#4285F4"/>
  <text x="170" y="132" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">1</text>
  <text x="170" y="175" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#4285F4">Crawling</text>
  <text x="170" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Zeh page et suivi des liens</text>
  <text x="170" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Googlebot découvre le contenu</text>
  <text x="170" y="238" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">&#x2022; Robots.txt</text>
  <text x="170" y="253" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">&#x2022; Sitemap.xml</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="170" x2="340" y2="170" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Étape 2: Indexation -->
  <rect x="350" y="80" width="240" height="180" rx="15" fill="#FCE8E6" stroke="#EA4335" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="470" cy="125" r="30" fill="#EA4335"/>
  <text x="470" y="132" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">2</text>
  <text x="470" y="175" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#EA4335">Indexation</text>
  <text x="470" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Analyse et stockage</text>
  <text x="470" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">dans l'index Google</text>
  <text x="470" y="238" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">&#x2022; Meta Robots</text>
  <text x="470" y="253" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">&#x2022; Canonical Tag</text>

  <!-- Arrow 2 -->
  <line x1="590" y1="170" x2="640" y2="170" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Étape 3: Ranking -->
  <rect x="650" y="80" width="220" height="180" rx="15" fill="#E6F4EA" stroke="#34A853" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="760" cy="125" r="30" fill="#34A853"/>
  <text x="760" y="132" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">3</text>
  <text x="760" y="175" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#34A853">Ranking</text>
  <text x="760" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Classement dans les</text>
  <text x="760" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">SERP selon des</text>
  <text x="760" y="238" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">&#x2022; 200+ facteurs</text>
  <text x="760" y="253" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">&#x2022; Algorithmes</text>

  <!-- Résultat SERP -->
  <rect x="100" y="310" width="700" height="120" rx="12" fill="white" stroke="#ddd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="100" y="310" width="700" height="35" rx="12" fill="#1a1a2e"/>
  <rect x="100" y="335" width="700" height="5" fill="#1a1a2e"/>
  <text x="160" y="334" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">Résultat dans les SERP (Search Engine Results Page)</text>

  <!-- Mock SERP -->
  <text x="130" y="370" font-family="Arial" font-size="11" fill="#4285F4">https://www.exemple.com</text>
  <text x="130" y="390" font-family="Arial" font-size="15" font-weight="bold" fill="#1a0dab">Titre de la page - Mot-clé principal</text>
  <text x="130" y="410" font-family="Arial" font-size="12" fill="#545454">Ceci est un exemple de résultat de recherche Google.</text>
  <text x="130" y="425" font-family="Arial" font-size="12" fill="#545454">Le titre, la description et l'URL sont optimisés pour le SEO.</text>

  <!-- Legend -->
  <rect x="150" y="460" width="600" height="110" rx="10" fill="#f1f3f4"/>
  <text x="450" y="485" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Facteurs influençant chaque étape</text>

  <rect x="180" y="500" width="15" height="15" rx="3" fill="#4285F4"/>
  <text x="200" y="512" font-family="Arial" font-size="11" fill="#333">Crawling : Structure du site, vitesse, robots.txt, sitemap</text>

  <rect x="180" y="520" width="15" height="15" rx="3" fill="#EA4335"/>
  <text x="200" y="532" font-family="Arial" font-size="11" fill="#333">Indexation : Qualité du contenu, balises meta, données structurées</text>

  <rect x="180" y="540" width="15" height="15" rx="3" fill="#34A853"/>
  <text x="200" y="552" font-family="Arial" font-size="11" fill="#333">Ranking : Backlinks, E-E-A-T, Core Web Vitals, pertinence</text>
</svg>
