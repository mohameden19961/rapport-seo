<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <rect width="760" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="760" height="38" fill="#2C5F8A"/>
  <text x="380.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Les 3 Core Web Vitals : metriques cles</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <rect x="30" y="90" width="200" height="60" rx="5" fill="#188038"/>
  <text x="130.0" y="124.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">LCP</text>
  <text x="40" y="175" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Largest Contentful Paint</text>
  <text x="40" y="195" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Charge du contenu principal</text>
  <text x="40" y="215" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Objectif: < 2.5s</text>
  <rect x="280" y="90" width="200" height="60" rx="5" fill="#1A73E8"/>
  <text x="380.0" y="124.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">INP</text>
  <text x="290" y="175" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Interaction to Next Paint</text>
  <text x="290" y="195" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Reactivite aux interactions</text>
  <text x="290" y="215" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Objectif: < 200ms</text>
  <rect x="530" y="90" width="200" height="60" rx="5" fill="#F9AB00"/>
  <text x="630.0" y="124.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">CLS</text>
  <text x="540" y="175" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Cumulative Layout Shift</text>
  <text x="540" y="195" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Stabilite visuelle</text>
  <text x="540" y="215" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Objectif: < 0.1</text>
  <rect x="30" y="260" width="700" height="45" rx="5" fill="#2C5F8A"/>
  <text x="380.0" y="286.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold">Outils de mesure: PageSpeed Insights, GSC Core Web Vitals, Lighthouse, CrUX</text>
  <text x="40" y="330" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ LCP: optimisez image hero (WebP, fetchpriority=high), prechargez les polices</text>
  <text x="40" y="360" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ INP: evitez les taches longues (>50ms), differer le JS tiers</text>
  <text x="40" y="390" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ CLS: dimensions explicites sur toutes les images, espace reserve pubs</text>
  <rect x="30" y="420" width="700" height="35" rx="5" fill="#D93025"/>
  <text x="380.0" y="441.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Les Core Web Vitals sont un facteur de classement depuis mars 2024 (INP a remplace FID)</text>
</svg>
