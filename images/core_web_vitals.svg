<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="g_lcp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8E3E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_inp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBC05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9AB00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_cls" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D93025;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="900" height="550" rx="15" fill="#f8f9fa"/>

  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">Core Web Vitals - Les indicateurs essentiels de Google</text>

  <!-- LCP -->
  <rect x="40" y="70" width="260" height="220" rx="12" fill="white" stroke="#34A853" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="70" width="260" height="45" rx="12" fill="url(#g_lcp)"/>
  <rect x="40" y="100" width="260" height="15" fill="url(#g_lcp)"/>
  <text x="170" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">LCP</text>
  <text x="170" y="138" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#34A853">Largest Contentful Paint</text>
  <text x="170" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Temps de chargement du</text>
  <text x="170" y="173" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">plus grand élément visible</text>
  <text x="170" y="193" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#34A853">Cible : &lt; 2.5 secondes</text>

  <rect x="75" y="215" width="190" height="55" rx="8" fill="#E6F4EA"/>
  <text x="170" y="233" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Image hero, titre principal</text>
  <text x="170" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">ou vidéo d'arrière-plan</text>
  <text x="170" y="263" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Optimiser compression</text>

  <!-- INP -->
  <rect x="320" y="70" width="260" height="220" rx="12" fill="white" stroke="#FBBC05" stroke-width="2" filter="url(#shadow)"/>
  <rect x="320" y="70" width="260" height="45" rx="12" fill="url(#g_inp)"/>
  <rect x="320" y="100" width="260" height="15" fill="url(#g_inp)"/>
  <text x="450" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">INP</text>
  <text x="450" y="138" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#F9AB00">Interaction to Next Paint</text>
  <text x="450" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Temps de réponse après</text>
  <text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">une interaction utilisateur</text>
  <text x="450" y="193" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#F9AB00">Cible : &lt; 200 ms</text>

  <rect x="355" y="215" width="190" height="55" rx="8" fill="#FEF7E0"/>
  <text x="450" y="233" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Clics, taps, saisies</text>
  <text x="450" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">clavier sur la page</text>
  <text x="450" y="263" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Optimiser JS et événements</text>

  <!-- CLS -->
  <rect x="600" y="70" width="260" height="220" rx="12" fill="white" stroke="#EA4335" stroke-width="2" filter="url(#shadow)"/>
  <rect x="600" y="70" width="260" height="45" rx="12" fill="url(#g_cls)"/>
  <rect x="600" y="100" width="260" height="15" fill="url(#g_cls)"/>
  <text x="730" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">CLS</text>
  <text x="730" y="138" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#EA4335">Cumulative Layout Shift</text>
  <text x="730" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Stabilité visuelle des</text>
  <text x="730" y="173" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">éléments pendant le chargement</text>
  <text x="730" y="193" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#EA4335">Cible : &lt; 0.1</text>

  <rect x="635" y="215" width="190" height="55" rx="8" fill="#FCE8E6"/>
  <text x="730" y="233" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Images sans dimensions</text>
  <text x="730" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Polices, pubs, iframes</text>
  <text x="730" y="263" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Définir width/height</text>

  <!-- Section Impact -->
  <rect x="40" y="320" width="820" height="200" rx="12" fill="#1a1a2e" filter="url(#shadow)"/>

  <text x="450" y="350" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Impact des Core Web Vitals sur le SEO</text>

  <!-- Barres d'évaluation -->
  <text x="80" y="385" font-family="Arial" font-size="12" fill="#34A853" font-weight="bold">Bon</text>
  <rect x="120" y="375" width="200" height="15" rx="7" fill="#34A853"/>
  <text x="330" y="385" font-family="Arial" font-size="10" fill="#ccc">LCP &lt; 2.5s, INP &lt; 200ms, CLS &lt; 0.1</text>

  <text x="80" y="415" font-family="Arial" font-size="12" fill="#FBBC05" font-weight="bold">Moyen</text>
  <rect x="120" y="405" width="150" height="15" rx="7" fill="#FBBC05"/>
  <text x="330" y="415" font-family="Arial" font-size="10" fill="#ccc">LCP &lt; 4s, INP &lt; 500ms, CLS &lt; 0.25</text>

  <text x="80" y="445" font-family="Arial" font-size="12" fill="#EA4335" font-weight="bold">Mauvais</text>
  <rect x="120" y="435" width="100" height="15" rx="7" fill="#EA4335"/>
  <text x="330" y="445" font-family="Arial" font-size="10" fill="#ccc">LCP > 4s, INP > 500ms, CLS > 0.25</text>

  <text x="80" y="475" font-family="Arial" font-size="11" fill="#aaa">Source : Google Search Console - Rapport Core Web Vitals</text>
  <text x="80" y="495" font-family="Arial" font-size="11" fill="#aaa">Impact direct sur le classement mobile et desktop depuis l'update 2021</text>

  <rect x="600" y="370" width="220" height="130" rx="10" fill="#2d2d4e"/>
  <text x="710" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#FBBC05">Outils de mesure</text>
  <text x="620" y="415" font-family="Arial" font-size="10" fill="#ddd">- PageSpeed Insights</text>
  <text x="620" y="433" font-family="Arial" font-size="10" fill="#ddd">- Lighthouse</text>
  <text x="620" y="451" font-family="Arial" font-size="10" fill="#ddd">- Search Console</text>
  <text x="620" y="469" font-family="Arial" font-size="10" fill="#ddd">- CrUX (Chrome UX Report)</text>
  <text x="620" y="487" font-family="Arial" font-size="10" fill="#ddd">- Web Vitals Extension</text>
</svg>
