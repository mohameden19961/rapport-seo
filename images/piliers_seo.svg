<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="g_onpage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1967D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_tech" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8E3E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_offpage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBC05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9AB00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g_success" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FBBC05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" rx="15" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">Les 3 piliers fondamentaux du SEO</text>

  <!-- Pilier 1: On-Page SEO -->
  <rect x="40" y="80" width="260" height="400" rx="15" fill="#E8F0FE" stroke="#4285F4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="80" width="260" height="50" rx="15" fill="url(#g_onpage)"/>
  <rect x="40" y="110" width="260" height="20" fill="url(#g_onpage)"/>
  <text x="170" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">On-Page SEO</text>

  <text x="170" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#4285F4">Contenu</text>
  <text x="170" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Recherche de mots-clés</text>
  <text x="170" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Intention de recherche</text>
  <text x="170" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Qualité et pertinence</text>
  <text x="170" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">E-E-A-T</text>

  <line x1="90" y1="250" x2="250" y2="250" stroke="#4285F4" stroke-width="0.5" opacity="0.3"/>

  <text x="170" y="275" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#4285F4">Balises HTML</text>
  <text x="170" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Title Tag (60 car.)</text>
  <text x="170" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Meta Description</text>
  <text x="170" y="335" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">H1, H2, H3 (structure)</text>

  <line x1="90" y1="350" x2="250" y2="350" stroke="#4285F4" stroke-width="0.5" opacity="0.3"/>

  <text x="170" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#4285F4">Optimisation</text>
  <text x="170" y="390" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Balises Alt des images</text>
  <text x="170" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Maillage interne</text>
  <text x="170" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">URLs optimisées</text>

  <circle cx="170" cy="455" r="25" fill="#4285F4"/>
  <text x="170" y="460" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">40%</text>

  <!-- Pilier 2: Technical SEO -->
  <rect x="320" y="80" width="260" height="400" rx="15" fill="#E6F4EA" stroke="#34A853" stroke-width="2" filter="url(#shadow)"/>
  <rect x="320" y="80" width="260" height="50" rx="15" fill="url(#g_tech)"/>
  <rect x="320" y="110" width="260" height="20" fill="url(#g_tech)"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">SEO Technique</text>

  <text x="450" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#34A853">Performance</text>
  <text x="450" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Core Web Vitals (LCP, INP, CLS)</text>
  <text x="450" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Vitesse de chargement</text>
  <text x="450" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Mobile-First Indexing</text>

  <line x1="370" y1="230" x2="530" y2="230" stroke="#34A853" stroke-width="0.5" opacity="0.3"/>

  <text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#34A853">Architecture</text>
  <text x="450" y="275" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Donnés structurées (Schema)</text>
  <text x="450" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">HTTPS / Sécurité</text>
  <text x="450" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Fichiers robots.txt</text>
  <text x="450" y="335" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Sitemap.xml</text>

  <line x1="370" y1="350" x2="530" y2="350" stroke="#34A853" stroke-width="0.5" opacity="0.3"/>

  <text x="450" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#34A853">Indexation</text>
  <text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Balises Canonical</text>
  <text x="450" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Gestion du budget de crawl</text>
  <text x="450" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Erreurs 404 / Redirections</text>

  <circle cx="450" cy="455" r="25" fill="#34A853"/>
  <text x="450" y="460" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">30%</text>

  <!-- Pilier 3: Off-Page SEO -->
  <rect x="600" y="80" width="260" height="400" rx="15" fill="#FEF7E0" stroke="#FBBC05" stroke-width="2" filter="url(#shadow)"/>
  <rect x="600" y="80" width="260" height="50" rx="15" fill="url(#g_offpage)"/>
  <rect x="600" y="110" width="260" height="20" fill="url(#g_offpage)"/>
  <text x="730" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Off-Page SEO</text>

  <text x="730" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#F9AB00">Backlinks</text>
  <text x="730" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Link Building stratgique</text>
  <text x="730" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Dofollow vs Nofollow</text>
  <text x="730" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Qualit > Quantité</text>
  <text x="730" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Netlinking naturel</text>

  <line x1="660" y1="250" x2="800" y2="250" stroke="#FBBC05" stroke-width="0.5" opacity="0.3"/>

  <text x="730" y="275" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#F9AB00">Autorité</text>
  <text x="730" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Domain Authority (DA)</text>
  <text x="730" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Page Authority (PA)</text>
  <text x="730" y="335" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Trust Flow / Citation Flow</text>

  <line x1="660" y1="350" x2="800" y2="350" stroke="#FBBC05" stroke-width="0.5" opacity="0.3"/>

  <text x="730" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#F9AB00">Social &amp; Marque</text>
  <text x="730" y="390" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">SEO Local</text>
  <text x="730" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Signaux sociaux</text>
  <text x="730" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">E-réputation</text>

  <circle cx="730" cy="455" r="25" fill="#FBBC05"/>
  <text x="730" y="460" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#333">30%</text>

  <!-- Barre de succès -->
  <rect x="100" y="530" width="700" height="80" rx="15" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="450" y="560" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Succès SEO = On-Page + Technique + Off-Page</text>
  <rect x="150" y="575" width="600" height="20" rx="10" fill="#333"/>
  <rect x="150" y="575" width="600" height="20" rx="10" fill="url(#g_success)" opacity="0.8"/>
  <text x="450" y="590" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Résultats durables et visibilité maximale dans les SERP</text>
</svg>
