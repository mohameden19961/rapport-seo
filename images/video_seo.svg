  <text x="380.0" y="259.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Les pages video ont 53x plus de chance d'apparaitre en Page 1 de Google (source: Backlinko 2025)</text>
