<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1967D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8E3E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBC05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9AB00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D93025;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4285F4"/>
    </marker>
  </defs>

  <rect width="900" height="650" rx="15" fill="#f8f9fa"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">Processus de stratgie SEO - Du diagnostic aux résultats</text>

  <!-- Étape 1: Audit -->
  <rect x="40" y="80" width="190" height="160" rx="10" fill="white" stroke="#4285F4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="80" width="190" height="40" rx="10" fill="url(#g1)"/>
  <rect x="40" y="110" width="190" height="10" fill="url(#g1)"/>
  <text x="135" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">1. Audit SEO</text>
  <text x="135" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Analyse technique</text>
  <text x="135" y="158" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Analyse des concurrents</text>
  <text x="135" y="176" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Identification des</text>
  <text x="135" y="194" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">problmes d'indexation</text>
  <text x="135" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Benchmarking</text>

  <line x1="230" y1="160" x2="270" y2="160" stroke="#4285F4" stroke-width="2.5" marker-end="url(#arrow_blue)"/>

  <!-- Étape 2: Stratégie -->
  <rect x="280" y="80" width="190" height="160" rx="10" fill="white" stroke="#34A853" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="80" width="190" height="40" rx="10" fill="url(#g2)"/>
  <rect x="280" y="110" width="190" height="10" fill="url(#g2)"/>
  <text x="375" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">2. Stratgie</text>
  <text x="375" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Dfinition des objectifs</text>
  <text x="375" y="158" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Recherche de mots-cls</text>
  <text x="375" y="176" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Cartographie du contenu</text>
  <text x="375" y="194" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Plan de netlinking</text>
  <text x="375" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Calendrier ditorial</text>

  <line x1="470" y1="160" x2="510" y2="160" stroke="#34A853" stroke-width="2.5" marker-end="url(#arrow_blue)"/>

  <!-- Étape 3: Implémentation -->
  <rect x="520" y="80" width="190" height="160" rx="10" fill="white" stroke="#FBBC05" stroke-width="2" filter="url(#shadow)"/>
  <rect x="520" y="80" width="190" height="40" rx="10" fill="url(#g3)"/>
  <rect x="520" y="110" width="190" height="10" fill="url(#g3)"/>
  <text x="615" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">3. Implémentation</text>
  <text x="615" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Otimisation On-Page</text>
  <text x="615" y="158" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Corrections techniques</text>
  <text x="615" y="176" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Cration de contenu</text>
  <text x="615" y="194" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Campagne de link building</text>
  <text x="615" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Donnes structures</text>

  <line x1="710" y1="160" x2="750" y2="160" stroke="#FBBC05" stroke-width="2.5" marker-end="url(#arrow_blue)"/>

  <!-- Étape 4: Mesure -->
  <rect x="760" y="80" width="120" height="160" rx="10" fill="white" stroke="#EA4335" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="80" width="120" height="40" rx="10" fill="url(#g4)"/>
  <rect x="760" y="110" width="120" height="10" fill="url(#g4)"/>
  <text x="820" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">4. Mesure</text>
  <text x="820" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">KPIs tracking</text>
  <text x="820" y="158" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Analytics</text>
  <text x="820" y="176" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Search Console</text>
  <text x="820" y="194" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Rapports</text>

  <!-- Boucle de rétroaction -->
  <path d="M 820 240 Q 820 300 700 320 Q 500 350 300 320 Q 100 300 100 240" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow_blue)"/>
  <text x="450" y="340" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a2e">Boucle d'amlioration continue (Itrative)</text>

  <!-- Section détaillée des KPIs -->
  <rect x="40" y="370" width="820" height="250" rx="12" fill="white" stroke="#1a1a2e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="400" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e">Indicateurs cls de performance (KPIs SEO)</text>

  <!-- Tableau -->
  <rect x="60" y="420" width="380" height="30" rx="5" fill="#1a1a2e"/>
  <text x="250" y="440" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Catgorie</text>

  <rect x="440" y="420" width="400" height="30" rx="5" fill="#1a1a2e"/>
  <text x="640" y="440" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Indicateur</text>

  <rect x="60" y="450" width="380" height="25" fill="#E8F0FE"/>
  <text x="250" y="468" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Trafic organique</text>
  <rect x="440" y="450" width="400" height="25" fill="#E8F0FE"/>
  <text x="640" y="468" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Sessions, utilisateurs, pages vues</text>

  <rect x="60" y="475" width="380" height="25" fill="#E6F4EA"/>
  <text x="250" y="493" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Classement (Ranking)</text>
  <rect x="440" y="475" width="400" height="25" fill="#E6F4EA"/>
  <text x="640" y="493" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Position moyenne par mot-cl</text>

  <rect x="60" y="500" width="380" height="25" fill="#FEF7E0"/>
  <text x="250" y="518" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Taux de conversion</text>
  <rect x="440" y="500" width="400" height="25" fill="#FEF7E0"/>
  <text x="640" y="518" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Objectifs atteints / sessions</text>

  <rect x="60" y="525" width="380" height="25" fill="#FCE8E6"/>
  <text x="250" y="543" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Autorit (Domain Authority)</text>
  <rect x="440" y="525" width="400" height="25" fill="#FCE8E6"/>
  <text x="640" y="543" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Score DA, Trust Flow, Citation Flow</text>

  <rect x="60" y="550" width="380" height="25" fill="#f1f3f4"/>
  <text x="250" y="568" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Indexation</text>
  <rect x="440" y="550" width="400" height="25" fill="#f1f3f4"/>
  <text x="640" y="568" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Pages indexes, erreurs de crawl</text>

  <rect x="60" y="575" width="380" height="25" fill="#E8F0FE"/>
  <text x="250" y="593" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Core Web Vitals</text>
  <rect x="440" y="575" width="400" height="25" fill="#E8F0FE"/>
  <text x="640" y="593" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">LCP, INP, CLS</text>
</svg>
