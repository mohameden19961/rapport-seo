<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
  <rect width="760" height="500" fill="#FFFFFF"/>
  <rect x="0" y="0" width="760" height="38" fill="#2C5F8A"/>
  <text x="380.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Optimisation du Crawl Budget</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <text x="30" y="60" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="14">Facteurs qui influencent le crawl budget:</text>
  <rect x="30" y="80" width="200" height="45" rx="5" fill="#1A73E8"/>
  <text x="130.0" y="106.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Popularite du site</text>
  <text x="250" y="98" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Plus de trafic = plus de crawl</text>
  <rect x="30" y="140" width="200" height="45" rx="5" fill="#1A73E8"/>
  <text x="130.0" y="166.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Vitesse du serveur</text>
  <text x="250" y="158" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Serveur lent = moins de crawl</text>
  <rect x="30" y="200" width="200" height="45" rx="5" fill="#1A73E8"/>
  <text x="130.0" y="226.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Qualite du contenu</text>
  <text x="250" y="218" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Mise a jour frequente privilegiee</text>
  <rect x="30" y="260" width="200" height="45" rx="5" fill="#1A73E8"/>
  <text x="130.0" y="286.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Sitemap XML</text>
  <text x="250" y="278" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Guide les robots vers les pages</text>
  <rect x="30" y="320" width="200" height="45" rx="5" fill="#1A73E8"/>
  <text x="130.0" y="346.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">URLs parametrees</text>
  <text x="250" y="338" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">Parametres = dilution du budget</text>
  <rect x="100" y="400" width="560" height="50" rx="5" fill="#188038"/>
  <text x="380.0" y="429.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold">Objectif: maximiser le nombre de pages importantes explorees chaque jour</text>
</svg>
