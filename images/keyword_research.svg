  <text x="182" y="180" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="10">Ahrefs, Semrush, GKP</text>
  <line x1="300" y1="130" x2="360" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="100" width="120" height="60" rx="5" fill="#1A73E8"/>
