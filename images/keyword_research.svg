  <text x="332" y="180" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="10">Volume de recherche mensuel</text>
  <line x1="450" y1="130" x2="510" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="100" width="120" height="60" rx="5" fill="#1A73E8"/>
