  <text x="70" y="370" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">70% des requetes</text>
  <rect x="260" y="310" width="180" height="45" rx="5" fill="#188038"/>
  <text x="350.0" y="336.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Navigationnel</text>
