<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <rect width="760" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="760" height="38" fill="#2C5F8A"/>
  <text x="380.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Processus de recherche de mots-cles</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <rect x="30" y="100" width="120" height="60" rx="5" fill="#1A73E8"/>
  <text x="90.0" y="134.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Mots-cles seeds</text>
  <text x="32" y="180" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="10">Brainstorming de base</text>
  <line x1="150" y1="130" x2="210" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="100" width="120" height="60" rx="5" fill="#1A73E8"/>
