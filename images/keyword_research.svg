  <text x="482" y="180" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="10">Keyword Difficulty (KD)</text>
  <line x1="600" y1="130" x2="660" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="630" y="100" width="120" height="60" rx="5" fill="#1A73E8"/>
  <text x="690.0" y="134.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Priorisation</text>
  <text x="632" y="180" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="10">Matrice impact/effort</text>
  <rect x="30" y="230" width="700" height="55" rx="5" fill="#2C5F8A"/>
  <text x="380.0" y="261.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold">Classification des mots-cles par intention</text>
  <rect x="40" y="310" width="180" height="45" rx="5" fill="#188038"/>
