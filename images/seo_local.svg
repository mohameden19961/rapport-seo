  <text x="665" y="150" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#34A853">Citations NAP (Name, Address, Phone)</text>
  <text x="665" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Annuaires locaux, Pages Jaunes, 118000,</text>
  <text x="665" y="183" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Bing Places, Apple Maps, Yelp</text>

  <!-- Avis -->
  <rect x="480" y="195" width="370" height="55" rx="8" fill="#FEF7E0"/>
  <text x="665" y="215" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#F9AB00">Gestion des avis clients</text>
  <text x="665" y="235" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Encourager les avis positifs</text>
  <text x="665" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Rpondre professionnellement aux avis ngatifs</text>

  <!-- Contenu local -->
  <rect x="480" y="260" width="370" height="55" rx="8" fill="#FCE8E6"/>
  <text x="665" y="280" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#EA4335">Contenu optimis localement</text>
  <text x="665" y="300" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Crer des pages par ville/quartier</text>
  <text x="665" y="313" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Blog sur des vnements locaux</text>

  <!-- Backlinks locaux -->
  <rect x="480" y="325" width="370" height="55" rx="8" fill="#E8F0FE"/>
  <text x="665" y="345" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#4285F4">Netlinking local</text>
  <text x="665" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Partenariats avec entreprises locales</text>
  <text x="665" y="378" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Sponsoring, associations, mdias locaux</text>

  <text x="570" y="425" font-family="Arial" font-size="9" fill="#888">Le SEO Local est essentiel pour les commerces de proximit</text>
</svg>
