<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <rect x="0" y="0" width="760" height="38" fill="#2C5F8A"/>
  <text x="380.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Optimisation pour la Recherche Vocale</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <text x="30" y="60" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="13">La recherche vocale en croissance: assistants + smartphones + IoT</text>
  <rect x="30" y="80" width="140" height="50" rx="5" fill="#1A73E8"/>
  <text x="100.0" y="109.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Google Assistant</text>
  <text x="40" y="150" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">35% part de marche</text>
  <rect x="200" y="80" width="140" height="50" rx="5" fill="#1A73E8"/>
  <text x="270.0" y="109.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Amazon Alexa</text>
  <text x="210" y="150" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">25% part</text>
  <rect x="370" y="80" width="140" height="50" rx="5" fill="#1A73E8"/>
  <text x="440.0" y="109.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Siri</text>
  <text x="380" y="150" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">20% part</text>
  <rect x="540" y="80" width="140" height="50" rx="5" fill="#1A73E8"/>
  <text x="610.0" y="109.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Bing / Cortana</text>
  <text x="550" y="150" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">10% part</text>
  <rect x="30" y="200" width="700" height="45" rx="5" fill="#2C5F8A"/>
  <text x="380.0" y="226.5" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold">Optimisation pour le voice search</text>
  <text x="40" y="260" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ Ciblez les mots-cles conversationnels (questions en langage naturel)</text>
  <text x="40" y="288" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ Optimisez pour les featured snippets (reponse choisie par les assistants)</text>
  <text x="40" y="316" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ Utilisez le schema FAQ et HowTo pour les reponses vocales</text>
  <text x="40" y="344" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ Priorisez la vitesse de chargement (les assistants privilegient les sites rapides)</text>
  <text x="40" y="372" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">~ Contenu local: 'pres de moi' est une requete vocale tres frequente</text>
</svg>
