<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="38" fill="#2C5F8A"/>
  <text x="400.0" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold">Algorithme PageRank : propagation de l'autorite</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
  <text x="30" y="60" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="13">Formule simplifiee: PR(A) = (1-d) + d * sum(PR(Ti)/C(Ti))</text>
  <text x="30" y="80" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="11">ou d = facteur d'amortissement (0.85), C(Ti) = liens sortants</text>
  <rect x="300" y="120" width="180" height="50" rx="5" fill="#D93025"/>
  <text x="390.0" y="149.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">Page A (PR=5)</text>
  <rect x="30" y="210" width="120" height="60" rx="5" fill="#1A73E8"/>
  <text x="90.0" y="244.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold">Page B
PR=4
2 liens sortants</text>
  <line x1="90" y1="210" x2="390" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="210" width="120" height="60" rx="5" fill="#1A73E8"/>
  <text x="190.0" y="244.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold">Page C
PR=3
1 lien sortant</text>
  <line x1="190" y1="210" x2="390" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="210" width="120" height="60" rx="5" fill="#1A73E8"/>
  <text x="530.0" y="244.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold">Page D
PR=2
3 liens sortants</text>
  <line x1="530" y1="210" x2="390" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="210" width="120" height="60" rx="5" fill="#1A73E8"/>
  <text x="630.0" y="244.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold">Page E
PR=4
4 liens sortants</text>
  <line x1="630" y1="210" x2="390" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="170" x2="100" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="170" x2="160" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="170" x2="500" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="170" x2="600" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30" y="320" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="12">Vote de confiance: un lien de B vers A est un vote</text>
  <text x="30" y="345" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="12">Dilution: plus une page a de liens sortants, moins chaque lien a de valeur</text>
  <text x="30" y="370" fill="#222" font-family="Helvetica,Arial,sans-serif" font-size="12">Amortissement: le PageRank se propage avec un facteur 0.85 a chaque etape</text>
  <rect x="30" y="400" width="740" height="40" rx="5" fill="#188038"/>
  <text x="400.0" y="424.0" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">Le PageRank reste un signal fondamental, combine a des centaines d'autres facteurs en 2026</text>
</svg>
